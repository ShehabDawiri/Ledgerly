spring.application.name=Ledgerly

# ---------------------------------------------------------------------------
# Datasource
#
# Defaults to in-memory H2 so `./gradlew bootRun` works with zero setup and every
# run starts from a known ledger state. Every value is overridable by environment
# variable, so pointing at Postgres needs no code or file changes -- see the README.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:ledgerdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# The stress test opens many connections at once; without headroom they queue on the
# pool and the run measures HikariCP rather than the ledger's concurrency control.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}

# ---------------------------------------------------------------------------
# JPA
# ---------------------------------------------------------------------------
# create-drop suits the in-memory demo database. Against a real database use
# `validate` and manage the schema with migrations instead.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}

# Off by default: logging every statement destroys throughput and drowns the output
# during a stress run. Set SHOW_SQL=true when debugging a single request.
spring.jpa.show-sql=${SHOW_SQL:false}

# Transaction boundaries should be explicit and live in the service layer. OSIV keeps a
# persistence context open for the whole HTTP request, which papers over exactly the kind
# of boundary mistakes this project is meant to demonstrate handling correctly.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# H2 console -- development convenience, disabled unless explicitly enabled.
# Never enable this on a publicly reachable deployment: it is an unauthenticated
# SQL shell over HTTP.
# ---------------------------------------------------------------------------
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Actuator -- only health, info and metrics are exposed. Widening this on a public
# deployment leaks configuration, environment and thread dumps.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never

# ---------------------------------------------------------------------------
# Ledgerly
# ---------------------------------------------------------------------------
# Retry budget for optimistic-lock conflicts before a transfer is rejected with 409.
ledgerly.transfer.max-attempts=${TRANSFER_MAX_ATTEMPTS:10}
# Backoff base; doubles per attempt, capped, with full jitter.
ledgerly.transfer.base-backoff-millis=${TRANSFER_BASE_BACKOFF_MILLIS:5}
ledgerly.transfer.max-backoff-millis=${TRANSFER_MAX_BACKOFF_MILLIS:250}

# How long an idempotency key stays replayable before it is purged (ISO-8601 duration).
ledgerly.idempotency.retention=${IDEMPOTENCY_RETENTION:PT24H}
ledgerly.idempotency.cleanup.enabled=${IDEMPOTENCY_CLEANUP_ENABLED:true}
ledgerly.idempotency.cleanup.initial-delay=PT1H
ledgerly.idempotency.cleanup.interval=PT1H
